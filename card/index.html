<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Ganga</title>
<style>
  :root{
    --gap: clamp(2px, 0.4vw, 6px);
    --page-ratio: 1.33333;
    --page-w: clamp(130px, min(calc((96.5vw - var(--gap))/2), calc(84vh * var(--page-ratio))), 700px);
    --ink: #4a2e22;
    --accent: #c0392b;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overscroll-behavior: none;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
  }
  img{
    -webkit-user-drag: none;
    -webkit-touch-callout: none;
    user-select: none;
    -webkit-user-select: none;
  }
  a, button, .envelope-hit, .seal-hit, .bg-star.interactive, .cover-heart-hit{
    touch-action: manipulation;
  }
  body{
    font-family: Georgia, 'Times New Roman', serif;
    color: var(--ink);
    background:
      radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 85%, rgba(0,0,0,0.08), transparent 55%),
      repeating-linear-gradient(115deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 5px),
      linear-gradient(160deg, #d9c294, #c9ad78 45%, #d3b988 100%);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  .stage{
    min-height: 100vh;
    min-height: 100dvh;
    display:flex;
    flex-direction: column;
    align-items:center;
    justify-content:center;
    padding: clamp(10px, 2.5vh, 26px) 9px clamp(10px, 2.5vh, 22px);
    position: relative;
  }

  /* one soft ambient pool underneath the whole book, like it's actually
     resting on the kraft surface rather than floating over the page —
     offset slightly down-right to agree with the light direction every
     other shadow in the scrapbook already uses */
  .table-shadow{
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--page-w) + 30px);
    height: calc((var(--page-w) / var(--page-ratio)) * 0.55);
    transform: translate(calc(-50% + 8px), calc(-50% + (var(--page-w) / var(--page-ratio)) * 0.36 + 10px));
    background: radial-gradient(ellipse at center, rgba(35,20,10,0.28), rgba(35,20,10,0) 72%);
    filter: blur(7px);
    pointer-events: none;
    z-index: 0;
    /* grows/shrinks in lockstep with the actual page movement below, so
       it never appears as a mismatched, oversized shape mid-transition */
    transition: width 950ms ease-in-out;
  }
  .table-shadow.open{
    width: calc(var(--page-w)*2 + var(--gap) + 50px);
  }

  /* small hand-drawn-feeling stars scattered on the kraft background,
     kept clear of the scrapbook itself */
  .bg-stars{
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bg-star{
    position: absolute;
    line-height: 1;
    user-select: none;
  }
  .bg-star.twinkle{
    animation: starTwinkle 6.5s ease-in-out infinite;
  }
  @keyframes starTwinkle{
    0%, 100%{ opacity: var(--base-op, 0.5); transform: rotate(var(--rot, 0deg)) translateY(0); }
    50%{ opacity: calc(var(--base-op, 0.5) * 0.4); transform: rotate(var(--rot, 0deg)) translateY(-2px); }
  }
  /* a handful of the stars are a tiny, undiscoverable-until-tapped easter egg */
  .bg-star.interactive{
    pointer-events: auto;
    cursor: pointer;
    padding: 16px;
    margin: -16px;
  }
  .bg-star.pop{
    animation: starPop 650ms ease-out !important;
  }
  @keyframes starPop{
    0%{   transform: rotate(var(--rot, 0deg)) scale(1); }
    35%{  transform: rotate(var(--rot, 0deg)) scale(1.65); }
    100%{ transform: rotate(var(--rot, 0deg)) scale(1); }
  }
  .star-spark{
    position: absolute;
    width: 4px; height: 4px;
    margin-left: -2px; margin-top: -2px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,241,214,0.95), rgba(255,241,214,0) 72%);
    pointer-events: none;
    opacity: 0;
    animation: sparkBurst 550ms ease-out forwards;
  }
  @keyframes sparkBurst{
    0%{   opacity: 0.9; transform: translate(0,0) scale(1); }
    100%{ opacity: 0;   transform: translate(var(--sx,10px), var(--sy,-10px)) scale(0.3); }
  }

  .https-hint{
    position: fixed;
    top: max(10px, env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    background: #3a2418;
    color: #f4e3c1;
    font-family: system-ui, sans-serif;
    font-size: 12.5px;
    line-height: 1.4;
    padding: 8px 14px;
    border-radius: 10px;
    max-width: min(90vw, 420px);
    text-align:center;
    z-index: 500;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
  }

  .book{
    position: relative;
    width: calc(var(--page-w)*2 + var(--gap));
    height: calc(var(--page-w) / var(--page-ratio));
    perspective: 1800px;
  }

  /* one shared body behind both pages, so the spread reads as a single
     physical object rather than two separate floating cards — it only
     shows itself once the book is open (see .book.open below) */
  .scrapbook-spread{
    position:absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: var(--page-w);
    transform: translateX(-50%);
    border-radius: 11px;
    background: #dcc498;
    /* layered soft shadow — a tight contact shadow plus a wide ambient
       one, like an object actually resting on the table rather than a
       flat CSS drop-shadow */
    box-shadow:
      0 1.5px 3px rgba(40,20,10,0.16),
      0 8px 18px rgba(40,20,10,0.2),
      0 26px 52px rgba(40,20,10,0.26);
    z-index: 0;
    /* exactly matches the closed cover's own footprint (same width,
       same centered position) so the cover fully hides it while closed
       — no opacity trick needed — then widens in lockstep with the
       pages as they actually spread apart */
    transition: width 950ms ease-in-out;
  }
  .book.open .scrapbook-spread{
    width: calc(var(--page-w)*2 + var(--gap));
  }

  /* a soft crease falling across the middle, uniting the two pages into
     one bound spread — not a hard line, just enough tonal shift to read
     as a fold */
  .spread-binding{
    position:absolute;
    top: 1.5%; bottom: 1.5%;
    left: 50%;
    width: 26px;
    margin-left: -13px;
    background: linear-gradient(90deg,
      rgba(40,20,10,0) 0%,
      rgba(40,20,10,0.12) 40%,
      rgba(40,20,10,0.22) 50%,
      rgba(40,20,10,0.12) 60%,
      rgba(40,20,10,0) 100%);
    opacity: 0;
    transition: opacity 250ms ease;
    pointer-events: none;
    z-index: 8;
  }
  .book.open .spread-binding{
    opacity: 1;
    transition: opacity 300ms ease 550ms;
  }

  .spread{
    position:absolute;
    inset:0;
    display:flex;
    gap: var(--gap);
    transition: transform 950ms ease-in-out;
    transform: translateX(0);
    z-index: 1;
  }
  .spread.closed{
    transform: translateX(calc(-1 * (var(--page-w) + var(--gap)) / 2));
  }

  .page{
    position:relative;
    width: var(--page-w);
    aspect-ratio: var(--page-ratio);
    background: #ecdcb8;
  }
  .page-left{
    transition: opacity 950ms ease-in-out;
    border-radius: 10px 0 0 10px;
    box-shadow: inset -12px 0 16px -12px rgba(40,20,10,0.4);
  }
  .spread.closed .page-left{ opacity: 0; pointer-events: none; }

  .page-right{
    overflow: hidden;
    border-radius: 0 10px 10px 0;
    box-shadow: inset 12px 0 16px -12px rgba(40,20,10,0.4);
  }
  .spread.closed .page-right{ pointer-events: none; }

  /* ---------- Cover ---------- */
  .cover-btn{
    position:absolute;
    left:50%; top:50%;
    width: var(--page-w);
    aspect-ratio: var(--page-ratio);
    transform: translate(-50%,-50%) rotateY(0deg);
    transform-origin: left center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 10px;
    overflow: hidden;
    border: none;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 16px 38px rgba(40,20,10,0.35), 0 3px 8px rgba(40,20,10,0.2);
    transition: transform 950ms ease-in-out, opacity 700ms ease-in-out 250ms, box-shadow 950ms ease-in-out;
    z-index: 20;
    -webkit-tap-highlight-color: transparent;
  }
  .cover-btn img{
    width:100%; height:100%; object-fit: cover; display:block;
    pointer-events: none;
  }
  .book.open .cover-btn{
    transform: translate(-50%,-50%) rotateY(-176deg);
    opacity: 0;
    box-shadow: none;
    pointer-events: none;
  }
  .cover-hint{
    position:absolute;
    bottom: 8%;
    left:50%;
    transform: translateX(-50%);
    font-family: system-ui, sans-serif;
    font-size: 11.5px;
    letter-spacing: .04em;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    background: rgba(0,0,0,0.22);
    padding: 5px 11px;
    border-radius: 999px;
    animation: pulse 2.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes pulse{ 0%,100%{opacity:.75} 50%{opacity:1} }

  /* one tiny cover easter egg, hidden inside the little heart sticker */
  .cover-heart-hit{
    position:absolute;
    left: 7%; top: 33.5%;
    width: 8%; height: 9.5%;
    z-index: 2;
  }
  .cover-heart-pop{
    position:absolute;
    left:50%; top:0;
    transform: translate(-50%,0) scale(0.5);
    font-size: 13px;
    color: #c0392b;
    opacity: 0;
    pointer-events: none;
  }
  .cover-heart-hit.pressed .cover-heart-pop{
    animation: coverHeartPop 900ms ease-out;
  }
  @keyframes coverHeartPop{
    0%{   opacity: 0;    transform: translate(-50%,0) scale(0.4); }
    25%{  opacity: 0.95; transform: translate(-50%,-8px) scale(1.15); }
    70%{  opacity: 0.7;  transform: translate(-50%,-24px) scale(1); }
    100%{ opacity: 0;    transform: translate(-50%,-38px) scale(0.85); }
  }
  .cover-spark{
    position:absolute;
    top: 30%;
    font-size: 8px;
    color: #f4d78a;
    opacity: 0;
    pointer-events: none;
  }
  .cover-spark.s1{ left: 12%; }
  .cover-spark.s2{ left: 78%; }
  .cover-heart-hit.pressed .cover-spark{
    animation: coverSparkPop 700ms ease-out;
  }
  .cover-heart-hit.pressed .cover-spark.s2{ animation-delay: 80ms; }
  @keyframes coverSparkPop{
    0%{   opacity: 0;    transform: scale(0.3) translateY(0); }
    40%{  opacity: 0.9;  transform: scale(1.2) translateY(-6px); }
    100%{ opacity: 0;    transform: scale(0.6) translateY(-14px); }
  }

  /* ---------- Letter page ---------- */
  .page-left{
    position:relative;
    perspective: 700px;
  }
  .page-left-bg{
    position:absolute; inset:0;
    overflow:hidden;
    border-radius: 10px 0 0 10px;
    z-index: 1;
  }
  @keyframes envelopeNudge{
    0%{   transform: translateY(0); }
    30%{  transform: translateY(1px); }
    100%{ transform: translateY(0); }
  }
  .page-left-bg.nudge{
    animation: envelopeNudge 260ms ease-out;
  }
  .envelope-img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit: cover;
    pointer-events: none;
  }

  /* invisible tap target over the envelope's body,
     not the whole page (so tapping the decorative corners does nothing) */
  .envelope-hit{
    position:absolute;
    left: 20%; right: 20%;
    top: 12%; bottom: 14%;
    z-index: 3;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  /* tiny wax-seal easter egg — sits right on top of the seal in the
     artwork, above envelope-hit, and never opens the letter itself */
  .seal-hit{
    position:absolute;
    left: 41%; top: 48%;
    width: 14%; height: 17%;
    z-index: 5;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* once the letter is out, taps in this zone should just tuck it back in,
     not trigger the seal easter egg underneath it */
  .page-left.lifted .seal-hit{
    pointer-events: none;
  }
  .seal-press{
    position:absolute;
    inset: -20%;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(60,20,15,0.32), rgba(60,20,15,0) 68%);
    opacity: 0;
    pointer-events: none;
  }
  .seal-hit.pressed .seal-press{
    animation: sealPress 550ms ease-out;
  }
  @keyframes sealPress{
    0%{ opacity: 0; transform: scale(0.82) rotate(0deg); }
    30%{ opacity: 0.85; transform: scale(1.06) rotate(-4deg); }
    58%{ opacity: 0.45; transform: scale(0.97) rotate(3deg); }
    100%{ opacity: 0; transform: scale(1) rotate(0deg); }
  }
  .seal-heart{
    position:absolute;
    left: 50%; top: -4px;
    transform: translate(-50%,0) scale(0.5);
    font-size: 13px;
    color: #c0392b;
    opacity: 0;
    pointer-events: none;
  }
  .seal-hit.pressed .seal-heart{
    animation: sealHeart 950ms ease-out;
  }
  @keyframes sealHeart{
    0%{ opacity: 0; transform: translate(-50%,0) scale(0.4); }
    28%{ opacity: 0.9; transform: translate(-50%,-7px) scale(1.1); }
    70%{ opacity: 0.65; transform: translate(-50%,-22px) scale(1); }
    100%{ opacity: 0; transform: translate(-50%,-34px) scale(0.82); }
  }

  /* clips to the page's own bounds at all times, so the letter can never
     be seen outside the page — tucked (fully below the fold, invisible)
     or lifted (fits inside with margin), it's always contained here */
  .letter-clip{
    position:absolute; inset:0;
    overflow:hidden;
    border-radius: 10px 0 0 10px;
    z-index: 2;
    pointer-events: none;
  }
  .letter-img{
    position:absolute;
    left:50%;
    top: 128%;
    width: calc(var(--page-w) * 0.46);
    aspect-ratio: 776/1054;
    object-fit: cover;
    border-radius: 3px;
    box-shadow: 0 4px 10px rgba(30,15,5,0.18);
    cursor: pointer;
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    transform-origin: 50% 100%;
    transform: translateX(-50%) rotate(-2deg) rotateX(26deg) scale(0.92);
    transition: transform 750ms cubic-bezier(.34,.02,.16,1), top 750ms cubic-bezier(.34,.02,.16,1), width 750ms cubic-bezier(.34,.02,.16,1), box-shadow 750ms ease;
  }

  .page-left.lifted .letter-img{
    top: 8%;
    width: calc(var(--page-w) * 0.46);
    transform: translateX(-50%) rotate(-1.5deg) rotateX(0deg) scale(1);
    box-shadow: 0 20px 38px rgba(20,10,5,0.4);
  }
  /* ---------- Candles page ---------- */
  .cake-wrap{ position:absolute; inset:0; }
  .cake-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }

  .flame{
    position:absolute;
    transform-origin: 50% 100%;
    will-change: transform;
  }
  .flame img{
    display:block;
    width:100%; height:100%;
    transform-origin: 50% 85%;
    animation: flicker 1.6s ease-in-out infinite;
  }
  @keyframes flicker{
    0%,100%{ transform: rotate(-2deg) scale(1); }
    30%{ transform: rotate(1.5deg) scale(1.03); }
    55%{ transform: rotate(-1deg) scale(0.98); }
    80%{ transform: rotate(2deg) scale(1.02); }
  }
  .flame.out{
    transition: transform 420ms ease-in, opacity 420ms ease-in;
    transform: scale(0.15) translateY(20%);
    opacity: 0;
  }
  .flame-left{ left: 41.835%; top: 37.984%; width: 2.721%; height: 7.823%; }
  .flame-center{ left: 48.730%; top: 36.613%; width: 3.448%; height: 8.387%; }
  .flame-right{ left: 55.384%; top: 40.968%; width: 2.298%; height: 4.355%; }

  .puff{
    position:absolute;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.85), rgba(255,255,255,0) 70%);
    transform: translate(-50%,-50%) scale(0.3);
    opacity: 0;
    pointer-events: none;
  }
  .puff.go{
    animation: puffUp 700ms ease-out forwards;
  }
  @keyframes puffUp{
    0%{ opacity: 0.9; transform: translate(-50%,-50%) scale(0.3); }
    100%{ opacity: 0; transform: translate(-50%,-140%) scale(1.6); }
  }

  /* soft smoke wisps rising from a blown-out wick */
  .smoke-wisp{
    position:absolute;
    width: 13px; height: 28px;
    margin-left: -6.5px;
    margin-top: -28px;
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 100%, rgba(250,248,244,0.92) 0%, rgba(240,236,228,0.55) 42%, rgba(240,236,228,0) 76%);
    filter: blur(1.3px);
    opacity: 0;
    pointer-events: none;
    z-index: 13;
    transform-origin: 50% 100%;
    animation-name: smokeRise;
    animation-timing-function: cubic-bezier(.25,.05,.4,1);
    animation-fill-mode: forwards;
  }
  @keyframes smokeRise{
    0%{    opacity: 0;    transform: translate(0, 0) scale(0.45) rotate(0deg); }
    10%{   opacity: 0.75; transform: translate(calc(var(--dx,10px) * 0.15), -14px) scale(0.7) rotate(calc(var(--rot,10deg) * 0.2)); }
    38%{   opacity: 0.62; transform: translate(calc(var(--dx,10px) * 0.55), -42px) scale(1.15) rotate(calc(var(--rot,10deg) * 0.6)); }
    70%{   opacity: 0.32; transform: translate(var(--dx,10px), -78px) scale(1.7) rotate(var(--rot,10deg)); }
    100%{  opacity: 0;    transform: translate(var(--dx2,18px), -118px) scale(2.3) rotate(var(--rot2,16deg)); }
  }

  /* tiny handwritten scrapbook note, tucked near the cake's base — this
     IS the hold-to-blow fallback button, just styled as a note rather
     than a UI control */
  .candle-controls{
    position:absolute;
    left: 50%;
    bottom: 3%;
    transform: translateX(-50%) rotate(-1.5deg);
    display:flex;
    flex-direction: column;
    align-items:center;
    gap: 5px;
    z-index: 15;
    transition: opacity 350ms ease;
  }
  .blow-btn{
    font-family: 'Segoe Script','Bradley Hand','Comic Sans MS', cursive;
    font-size: clamp(11.5px, 2.5vw, 14px);
    font-weight: 400;
    border: none;
    background: none;
    padding: 10px 14px;
    color: #7a4a2e;
    opacity: 0.8;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
  }
  .blow-btn:active, .blow-btn.holding{
    opacity: 1;
    color: var(--accent);
  }
  .meter-track{
    width: 54px;
    height: 3px;
    background: rgba(255,255,255,0.32);
    border: 1px solid rgba(74,46,34,0.18);
    border-radius: 999px;
    overflow:hidden;
  }
  .meter-fill{
    height:100%;
    width: 0%;
    background: linear-gradient(90deg, rgba(230,179,90,0.75), rgba(192,57,43,0.75));
    transition: width 90ms linear;
  }
  .mic-status{
    font-family: Georgia, serif;
    font-style: italic;
    font-size: 9px;
    color: #6b4226;
    opacity: 0.7;
    text-align:center;
    max-width: 160px;
  }

  /* a few tiny hand-drawn stars that gather loosely around the wish text */
  .wish-constellation{
    position:absolute; inset:0;
    pointer-events: none;
    z-index: 19;
    opacity: 0;
    transition: opacity 900ms ease;
  }
  .wish-constellation.show{ opacity: 1; }
  .const-star{
    position:absolute;
    color: rgba(233,217,184,0.9);
    text-shadow: 0 0 6px rgba(255,248,235,0.7);
    opacity: 0;
  }
  .wish-constellation.show .const-star{
    animation: constPop 1300ms ease-out forwards;
  }
  @keyframes constPop{
    0%{   opacity: 0;    transform: scale(0.4); }
    55%{  opacity: 0.9;  transform: scale(1.15); }
    100%{ opacity: 0.65; transform: scale(1); }
  }

  /* wish message + relight: written straight onto the page, no card/box/dim */
  .wish-note{
    position:absolute;
    left: 50%;
    bottom: 9%;
    transform: translateX(-50%) translateY(8px) scale(0.96);
    text-align:center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 800ms ease, transform 800ms cubic-bezier(.2,.7,.3,1);
    z-index: 20;
  }
  .wish-note.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0) scale(1);
    pointer-events: auto;
  }
  .wish-script{
    font-family: 'Segoe Script','Bradley Hand','Brush Script MT', cursive;
    font-size: clamp(21px, 6.5vw, 32px);
    color: var(--accent);
    text-shadow: 0 0 14px rgba(255,248,235,0.9), 0 0 4px rgba(255,248,235,0.9);
  }
  .wish-note.show .wish-script{
    animation: wishGlow 1000ms ease-out;
  }
  @keyframes wishGlow{
    0%{ text-shadow: 0 0 0 rgba(255,248,235,0); }
    45%{ text-shadow: 0 0 24px rgba(255,248,235,1), 0 0 9px rgba(255,248,235,1); }
    100%{ text-shadow: 0 0 14px rgba(255,248,235,0.9), 0 0 4px rgba(255,248,235,0.9); }
  }
  .wish-name{
    font-family: Georgia, serif;
    font-size: clamp(12px, 3vw, 15px);
    color: var(--ink);
    text-shadow: 0 0 10px rgba(255,248,235,0.9);
    margin-top: -4px;
  }
  .relight-btn{
    position:absolute;
    left: 50%;
    bottom: 3%;
    font-family: 'Segoe Script','Bradley Hand','Comic Sans MS', cursive;
    font-size: clamp(11px, 2.6vw, 13.5px);
    border: 1px dashed rgba(74,46,34,0.4);
    border-radius: 3px;
    padding: 10px 16px;
    background: rgba(246,236,210,0.85);
    color: #6b4226;
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(40,20,10,0.18);
    opacity: 0;
    transform: translateX(-50%) translateY(8px) scale(0.94) rotate(1.5deg);
    pointer-events: none;
    transition: opacity 500ms ease 200ms, transform 500ms cubic-bezier(.2,.7,.3,1) 200ms;

  .relight-btn.show{

    pointer-events: auto;
  }

  .confetti-canvas{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events: none;
    z-index: 26;
  }

  /* ---------- back button: a small paper tab, not a web button ---------- */
  .back-btn{
    position: relative;
    margin-top: clamp(14px,3vh,28px);
    font-family: 'Segoe Script','Bradley Hand','Comic Sans MS', cursive;
    font-size: clamp(13px, 2.6vw, 16px);
    font-weight: 400;
    border: 1px dashed rgba(74,46,34,0.4);
    border-radius: 3px;
    padding: 12px 20px;
    background: rgba(246,236,210,0.92);
    color: #6b4226;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(40,20,10,0.22);
    opacity: 0;
    transform: translateY(6px) rotate(-1.2deg);
    transition: opacity 400ms ease, transform 400ms ease;
    pointer-events: none;
  }
  .back-btn::before{
    content: '';
    position: absolute;
    top: -7px; left: 50%;
    width: 30px; height: 11px;
    transform: translateX(-50%) rotate(-2deg);
    background: rgba(230,179,90,0.5);
    box-shadow: 0 1px 2px rgba(0,0,0,0.12);
  }
  .stage.open .back-btn{
    opacity: 1;
    transform: translateY(0) rotate(-1.2deg);
    pointer-events: auto;
  }
  .stage.open .back-btn:active{
    transform: translateY(0) rotate(-1.2deg) scale(0.97);
  }
</style>

<script>
(function(){
  "use strict";

  var book = document.getElementById('book');
  var stage = document.getElementById('stage');
  var spread = document.getElementById('spread');
  var coverBtn = document.getElementById('coverBtn');
  var backBtn = document.getElementById('backBtn');
  var tableShadow = document.getElementById('tableShadow');

  var pageLeft = document.getElementById('pageLeft');
  var envelopeHit = document.getElementById('envelopeHit');
  var letterImg = document.getElementById('letterImg');

  var flames = [document.getElementById('flame1'), document.getElementById('flame2'), document.getElementById('flame3')];
  var meterFill = document.getElementById('meterFill');
  var blowBtn = document.getElementById('blowBtn');
  var micStatus = document.getElementById('micStatus');
  var wishNote = document.getElementById('wishNote');
  var wishConstellation = document.getElementById('wishConstellation');
  var candleControls = document.getElementById('candleControls');
  var relightBtn = document.getElementById('relightBtn');
  var confettiCanvas = document.getElementById('confettiCanvas');
  var httpsHint = document.getElementById('httpsHint');

  /* ---------------- tiny synthesized sound effects (self-contained, no audio files) ---------------- */
  var sfxCtx = null;
  function ensureSfxCtx(){
    if (sfxCtx) return sfxCtx;
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      sfxCtx = new Ctx();
    } catch (e) { sfxCtx = null; }
    return sfxCtx;
  }
  function resumeSfx(){
    var ctx = ensureSfxCtx();
    if (ctx && ctx.state === 'suspended') {
      try { ctx.resume(); } catch (e) {}
    }
    return ctx;
  }

  // reverse=true for closing — same paper character, swept the other way,
  // so opening and closing feel like mirrored physical motions. everything
  // here is noise-shaped (no tonal, fast-attack oscillator "tick"), so
  // nothing in it can read as a pop or a click.
  function playPageTurn(reverse){
    var ctx = resumeSfx();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;
      var dur = 0.62;

      // main body: a thick-paper rustle with a few soft amplitude swells,
      // like a hand actually moving a page rather than one smooth swoosh
      var buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        var t = i / data.length;
        var env = Math.sin(Math.PI * Math.min(1, t * 2.2)) * (1 - t * 0.55);
        var flutter = 0.6 + 0.25 * Math.sin(t * 38) + 0.15 * Math.sin(t * 95 + 1.3);
        data[i] = (Math.random() * 2 - 1) * env * flutter;
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;

      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      var f0 = reverse ? 2100 : 1200;
      var f1 = reverse ? 1250 : 2100;
      var f2 = reverse ? 1550 : 1650;
      filter.frequency.setValueAtTime(f0, now);
      filter.frequency.linearRampToValueAtTime(f1, now + dur * 0.55);
      filter.frequency.linearRampToValueAtTime(f2, now + dur);
      filter.Q.value = 0.7;

      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.05, now + 0.09);
      gain.gain.exponentialRampToValueAtTime(0.018, now + dur * 0.6);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.02);

      // a whisper-soft low tone underneath for a little paper "weight" —
      // slow attack, no pitch movement, so it never becomes a transient
      var body = ctx.createOscillator();
      body.type = 'sine';
      var bodyGain = ctx.createGain();
      body.frequency.value = reverse ? 200 : 230;
      bodyGain.gain.setValueAtTime(0.0001, now);
      bodyGain.gain.exponentialRampToValueAtTime(0.012, now + 0.15);
      bodyGain.gain.exponentialRampToValueAtTime(0.0001, now + dur * 0.85);
      body.connect(bodyGain);
      bodyGain.connect(ctx.destination);
      body.start(now);
      body.stop(now + dur);

      // soft settle at the very end — filtered noise fading out, not a
      // tonal tick, as the page finishes landing
      var settleStart = now + dur * 0.78;
      var settleDur = dur * 0.22;
      var sbuffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * settleDur), ctx.sampleRate);
      var sdata = sbuffer.getChannelData(0);
      for (var j = 0; j < sdata.length; j++) {
        var st = j / sdata.length;
        sdata[j] = (Math.random() * 2 - 1) * (1 - st);
      }
      var snoise = ctx.createBufferSource();
      snoise.buffer = sbuffer;
      var sfilter = ctx.createBiquadFilter();
      sfilter.type = 'lowpass';
      sfilter.frequency.value = 1000;
      var sgain = ctx.createGain();
      sgain.gain.setValueAtTime(0.0001, settleStart);
      sgain.gain.exponentialRampToValueAtTime(0.022, settleStart + 0.02);
      sgain.gain.exponentialRampToValueAtTime(0.0001, settleStart + settleDur);
      snoise.connect(sfilter);
      sfilter.connect(sgain);
      sgain.connect(ctx.destination);
      snoise.start(settleStart);
      snoise.stop(settleStart + settleDur + 0.02);
    } catch (e) {}
  }

  function playCelebrationChime(){
    var ctx = resumeSfx();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;

      // soft warm swell underneath — no percussive attack, just a gentle rise
      var swell = ctx.createOscillator();
      swell.type = 'sine';
      var swellGain = ctx.createGain();
      swell.frequency.setValueAtTime(523.25, now); // C5
      swellGain.gain.setValueAtTime(0.0001, now);
      swellGain.gain.exponentialRampToValueAtTime(0.035, now + 0.09);
      swellGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      swell.connect(swellGain);
      swellGain.connect(ctx.destination);
      swell.start(now);
      swell.stop(now + 0.65);

      // a warm little arpeggio of soft high chimes
      var notes = [783.99, 987.77, 1174.66]; // G5, B5, D6
      notes.forEach(function(freq, idx){
        var osc = ctx.createOscillator();
        osc.type = 'sine';
        var g = ctx.createGain();
        var start = now + 0.05 + idx * 0.1;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.045, start + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.7);
        osc.frequency.value = freq;
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.75);
      });

      // a whisper of high sparkle/shimmer underneath the chimes
      var dur = 0.5;
      var buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        var t = i / data.length;
        data[i] = (Math.random() * 2 - 1) * (1 - t) * 0.6;
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 4000;
      var noiseGain = ctx.createGain();
      var nstart = now + 0.06;
      noiseGain.gain.setValueAtTime(0.0001, nstart);
      noiseGain.gain.exponentialRampToValueAtTime(0.02, nstart + 0.03);
      noiseGain.gain.exponentialRampToValueAtTime(0.0001, nstart + dur);
      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(ctx.destination);
      noise.start(nstart);
      noise.stop(nstart + dur + 0.02);
    } catch (e) {}
  }

  function playSparkle(){
    var ctx = resumeSfx();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;
      var freqs = [1760, 2349.3]; // soft high twinkle
      freqs.forEach(function(freq, idx){
        var osc = ctx.createOscillator();
        osc.type = 'sine';
        var g = ctx.createGain();
        var start = now + idx * 0.045;
        g.gain.setValueAtTime(0.0001, start);
        g.gain.exponentialRampToValueAtTime(0.032, start + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, start + 0.26);
        osc.frequency.value = freq;
        osc.connect(g);
        g.connect(ctx.destination);
        osc.start(start);
        osc.stop(start + 0.28);
      });
    } catch (e) {}
  }

  function playSealSound(){
    var ctx = resumeSfx();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;
      var dur = 0.15;
      var buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        var t = i / data.length;
        data[i] = (Math.random() * 2 - 1) * (1 - t);
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1300;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.045, now + 0.014);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.02);

      var thump = ctx.createOscillator();
      thump.type = 'sine';
      var thumpGain = ctx.createGain();
      thump.frequency.setValueAtTime(170, now);
      thump.frequency.exponentialRampToValueAtTime(85, now + 0.09);
      thumpGain.gain.setValueAtTime(0.0001, now);
      thumpGain.gain.exponentialRampToValueAtTime(0.045, now + 0.01);
      thumpGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);
      thump.connect(thumpGain);
      thumpGain.connect(ctx.destination);
      thump.start(now);
      thump.stop(now + 0.14);
    } catch (e) {}
  }

  function playLetterRustle(){
    var ctx = resumeSfx();
    if (!ctx) return;
    try {
      var now = ctx.currentTime;
      var dur = 0.32;
      var buffer = ctx.createBuffer(1, Math.ceil(ctx.sampleRate * dur), ctx.sampleRate);
      var data = buffer.getChannelData(0);
      for (var i = 0; i < data.length; i++) {
        var t = i / data.length;
        var env = Math.sin(Math.PI * Math.min(1, t * 2.6)) * (1 - t * 0.6);
        var flutter = 0.75 + 0.25 * Math.sin(t * 55);
        data[i] = (Math.random() * 2 - 1) * env * flutter;
      }
      var noise = ctx.createBufferSource();
      noise.buffer = buffer;
      var filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1600, now);
      filter.frequency.linearRampToValueAtTime(2200, now + dur * 0.5);
      filter.frequency.linearRampToValueAtTime(1500, now + dur);
      filter.Q.value = 0.9;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.03, now + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + dur + 0.02);
    } catch (e) {}
  }

  /* ---------------- https / mic support notice ---------------- */
  var isSecure = (location.protocol === 'https:') ||
                  (location.hostname === 'localhost') ||
                  (location.hostname === '127.0.0.1');
  if (!isSecure) {
    httpsHint.hidden = false;

  /* ---------------- candles: mic + blow detection ---------------- */
  var BLOW_THRESHOLD = 0.045;   // raw RMS level that counts as "blowing"
  var BLOW_HOLD_MS   = 500;     // sustained blow duration before candles go out
  var MAX_BEND_DEG   = 32;

  var micAvailable = false;
  var micInitTried = false;
  var audioCtx = null, analyser = null, timeData = null;
  var micLevel = 0;              // 0..1, from real mic
  var fallbackHolding = false;
  var fallbackLevel = 0;         // 0..1, ramped while button/space held

  var blowStartTime = null;
  var candlesLit = [true, true, true];
  var rafId = null;

  function initMicOnce(){
    if (micInitTried) return;
    micInitTried = true;

    if (!isSecure || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micAvailable = false;
      micStatus.textContent = 'no mic — tap the note above to blow';
      startLoop();
      return;
    }

    navigator.mediaDevices.getUserMedia({ audio: true })
      .then(function(stream){
        var Ctx = window.AudioContext || window.webkitAudioContext;
        audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        var source = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.6;
        timeData = new Uint8Array(analyser.fftSize);
        source.connect(analyser);
        micAvailable = true;
        micStatus.textContent = '';
        startLoop();
      })
      .catch(function(){
        micAvailable = false;
        micStatus.textContent = 'no mic — tap the note above to blow';
        startLoop();
      });
  }

  function readMicLevel(){
    if (!analyser) return 0;
    analyser.getByteTimeDomainData(timeData);
    var sumSquares = 0;
    for (var i = 0; i < timeData.length; i++) {
      var v = (timeData[i] - 128) / 128;
      sumSquares += v * v;
    }
    return Math.sqrt(sumSquares / timeData.length); // ~0 silence .. ~0.3+ loud blow
  }

  var BEND_REF_LEVEL = 0.1; // raw level that produces a full, dramatic bend

  function startLoop(){
    if (rafId) return;
    var tick = function(){
      rafId = requestAnimationFrame(tick);

      if (micAvailable) {
        micLevel = readMicLevel();
      } else if (fallbackHolding) {
        fallbackLevel = Math.min(1, fallbackLevel + 0.045);
      } else {
        fallbackLevel = Math.max(0, fallbackLevel - 0.08);
      }

      var level = micAvailable ? micLevel : fallbackLevel;
      var displayLevel = Math.min(1, level * (micAvailable ? 5.5 : 1.15));
      meterFill.style.width = (displayLevel * 100).toFixed(0) + '%';

      // the flames always lean with however hard the breath is right now —
      // a weak breath gives a small lean, a strong one bends them right
      // over, well before the sustained-hold extinguish threshold kicks in
      var bendTarget = Math.min(1, level / BEND_REF_LEVEL) * MAX_BEND_DEG;
      applyBend(bendTarget);

      var blowing = micAvailable ? (level > BLOW_THRESHOLD) : (fallbackLevel > 0.12);
      var anyLit = candlesLit.indexOf(true) !== -1;

      if (blowing && anyLit) {
        if (blowStartTime === null) blowStartTime = performance.now();
        var elapsed = performance.now() - blowStartTime;
        if (elapsed >= BLOW_HOLD_MS) {
          extinguishAll();
        }
      } else {
        blowStartTime = null;
      }
    };
    tick();
  }

  // each flame responds to the same breath with its own tiny personality —
  // a slightly different strength and a slightly different lag — so they
  // never move in robotic lockstep
  var flameScale = [1.0, 0.88, 1.12];
  var flameEase = [0.22, 0.15, 0.27];
  var flameSmoothed = [0, 0, 0];

  function applyBend(targetDeg){
    var now = performance.now();
    for (var i = 0; i < flames.length; i++) {
      if (!candlesLit[i]) { flameSmoothed[i] = 0; continue; }
      var target = targetDeg * flameScale[i];
      flameSmoothed[i] += (target - flameSmoothed[i]) * flameEase[i];
      var jitter = Math.sin(now / 1000 * (1.3 + i * 0.17) + i * 2) * 1.4;
      var lean = flameSmoothed[i] + jitter;
      // a hard-bent flame also thins slightly, like real airflow stretching it
      var thin = 1 - Math.min(0.22, Math.abs(lean) / 160);
      flames[i].style.transform = 'rotate(' + lean + 'deg) scaleX(' + thin.toFixed(3) + ')';
    }
  }

  var activeSmoke = [];
  var wishHideTimer = null;

  function extinguishAll(){
    for (var i = 0; i < flames.length; i++) {
      if (!candlesLit[i]) continue;
      candlesLit[i] = false;
      flames[i].classList.add('out');
      flames[i].style.transform = '';
      spawnPuff(flames[i]);
      spawnSmoke(flames[i]);
    }
    blowStartTime = null;
    candleControls.style.opacity = '0';
    candleControls.style.pointerEvents = 'none';
    // a beat of quiet while the flames actually finish fading, then the
    // sound, confetti and wish text land together as one moment
    setTimeout(showWish, 480);
  }

  function spawnPuff(flameEl){
    var puff = document.createElement('div');
    puff.className = 'puff go';
    var rect = flameEl.getBoundingClientRect();
    var wrapRect = flameEl.parentElement.parentElement.getBoundingClientRect();
    puff.style.left = (rect.left - wrapRect.left + rect.width/2) + 'px';
    puff.style.top = (rect.top - wrapRect.top + rect.height*0.3) + 'px';
    flameEl.parentElement.parentElement.appendChild(puff);
    setTimeout(function(){ puff.remove(); }, 750);
  }

  function spawnSmoke(flameEl){
    var wrap = flameEl.parentElement.parentElement; // .page-right
    var rect = flameEl.getBoundingClientRect();
    var wrapRect = wrap.getBoundingClientRect();
    var x = rect.left - wrapRect.left + rect.width / 2;
    var yBase = rect.top - wrapRect.top + rect.height * 0.85;

    var wisps = 3;
    for (var w = 0; w < wisps; w++) {
      var el = document.createElement('div');
      el.className = 'smoke-wisp';
      el.style.left = x + 'px';
      el.style.top = yBase + 'px';

      var dx = (Math.random() * 22 - 11);
      var dx2 = dx + (Math.random() * 30 - 15);
      var rot = (Math.random() * 16 - 8);
      var rot2 = rot + (Math.random() * 26 - 13);
      var dur = 3.2 + Math.random() * 0.7;
      var delay = w * 0.32 + Math.random() * 0.12;

      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dx2', dx2 + 'px');
      el.style.setProperty('--rot', rot + 'deg');
      el.style.setProperty('--rot2', rot2 + 'deg');
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = delay + 's';

      wrap.appendChild(el);
      activeSmoke.push(el);

      (function(node, life){
        setTimeout(function(){
          if (node.parentNode) node.parentNode.removeChild(node);
          var idx = activeSmoke.indexOf(node);
          if (idx >= 0) activeSmoke.splice(idx, 1);
        }, life * 1000 + 120);
      })(el, dur + delay);
    }
  }

  function clearSmoke(){
    for (var i = 0; i < activeSmoke.length; i++) {
      if (activeSmoke[i].parentNode) activeSmoke[i].parentNode.removeChild(activeSmoke[i]);
    }
    activeSmoke = [];
  }

  /* ---------------- confetti ---------------- */
  var confettiCtx = confettiCanvas.getContext('2d');
  var confettiParticles = [];
  var confettiRaf = null;
  var confettiColors = ['#c0392b', '#e6b35a', '#a97cbf', '#f2c9d0', '#f4e3c1'];

  function resizeConfettiCanvas(){
    var rect = confettiCanvas.parentElement.getBoundingClientRect();
    confettiCanvas.width = rect.width * devicePixelRatio;
    confettiCanvas.height = rect.height * devicePixelRatio;
    confettiCanvas.style.width = rect.width + 'px';
    confettiCanvas.style.height = rect.height + 'px';
  }

  function addConfettiWave(count, o){
    var w = confettiCanvas.width, h = confettiCanvas.height;
    for (var i = 0; i < count; i++) {
      confettiParticles.push({
        x: Math.random() * w,
        y: -14 - Math.random() * h * 0.25,
        vx: (Math.random() - 0.5) * 1.6 * o.spread * devicePixelRatio,
        vy: (o.vyMin + Math.random() * (o.vyMax - o.vyMin)) * devicePixelRatio,
        size: (o.sizeMin + Math.random() * (o.sizeMax - o.sizeMin)) * devicePixelRatio,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.26,
        color: confettiColors[Math.floor(Math.random() * confettiColors.length)],
        shape: Math.random() < 0.62 ? 'ellipse' : (Math.random() < 0.5 ? 'heart' : 'star'),
        life: 0,
        maxLife: o.life + Math.random() * o.lifeVar,
        delay: o.delayed ? Math.floor(Math.random() * 16) : 0
      });
    }
  }

  function burstConfetti(){
    resizeConfettiCanvas();
    confettiParticles = [];
    // the regular soft drift (same "normal" design as before)
    addConfettiWave(26, { spread: 1, sizeMin: 2.8, sizeMax: 6, vyMin: 0.9, vyMax: 2.3, life: 100, lifeVar: 40 });
    // a livelier extra burst just for the blow-out moment, staggered in
    addConfettiWave(17, { spread: 1.8, sizeMin: 2, sizeMax: 4.2, vyMin: 1.3, vyMax: 3, life: 75, lifeVar: 30, delayed: true });
    if (confettiRaf) cancelAnimationFrame(confettiRaf);
    animateConfetti();
  }

  function stopConfetti(){
    confettiParticles = [];
    if (confettiRaf) { cancelAnimationFrame(confettiRaf); confettiRaf = null; }
    if (confettiCanvas.width && confettiCanvas.height) {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }
  }

  function drawConfettiHeart(ctx, s){
    ctx.beginPath();
    ctx.moveTo(0, s * 0.32);
    ctx.bezierCurveTo(-s, -s * 0.55, -s * 1.5, s * 0.4, 0, s * 1.25);
    ctx.bezierCurveTo(s * 1.5, s * 0.4, s, -s * 0.55, 0, s * 0.32);
    ctx.fill();
  }
  function drawConfettiStar(ctx, s){
    ctx.beginPath();
    for (var i = 0; i < 5; i++) {
      var a = -Math.PI / 2 + i * (Math.PI * 2 / 5);
      ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s);
      var a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a2) * s * 0.42, Math.sin(a2) * s * 0.42);
    }
    ctx.closePath();
    ctx.fill();
  }

  function animateConfetti(){
    var w = confettiCanvas.width, h = confettiCanvas.height;
    confettiCtx.clearRect(0, 0, w, h);
    var alive = false;
    for (var i = 0; i < confettiParticles.length; i++) {
      var p = confettiParticles[i];
      if (p.delay > 0) { p.delay--; alive = true; continue; }
      if (p.life >= p.maxLife) continue;
      alive = true;
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02 * devicePixelRatio;
      p.rot += p.vrot;
      p.life++;
      var fade = 1 - Math.max(0, (p.life - p.maxLife * 0.6) / (p.maxLife * 0.4));
      confettiCtx.save();
      confettiCtx.globalAlpha = Math.max(0, fade) * 0.85;
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rot);
      confettiCtx.fillStyle = p.color;
      if (p.shape === 'heart') {
        drawConfettiHeart(confettiCtx, p.size * 0.8);
      } else if (p.shape === 'star') {
        drawConfettiStar(confettiCtx, p.size * 0.85);
      } else {
        confettiCtx.beginPath();
        confettiCtx.ellipse(0, 0, p.size, p.size * 0.6, 0, 0, Math.PI * 2);
        confettiCtx.fill();
      }
      confettiCtx.restore();
    }
    if (alive) {
      confettiRaf = requestAnimationFrame(animateConfetti);
    } else {
      confettiCtx.clearRect(0, 0, w, h);
    }
  }

  /* ---------------- background stars ---------------- */
  var bgStars = document.getElementById('bgStars');
  var starColors = ['#a8382c', '#7a2e2e', '#8a5a7a', '#c98fa0', '#e9d9b8', '#4a2e22'];
  var starChars = ['★', '✦', '✧'];

  function spawnSparkles(anchorEl, containerEl){
    var containerRect = containerEl.getBoundingClientRect();
    var anchorRect = anchorEl.getBoundingClientRect();
    var cx = anchorRect.left - containerRect.left + anchorRect.width / 2;
    var cy = anchorRect.top - containerRect.top + anchorRect.height / 2;
    var n = 5;
    for (var i = 0; i < n; i++) {
      var el = document.createElement('span');
      el.className = 'star-spark';
      var angle = (Math.PI * 2 * i / n) + Math.random() * 0.6;
      var dist = 10 + Math.random() * 9;
      el.style.left = cx + 'px';
      el.style.top = cy + 'px';
      el.style.setProperty('--sx', Math.cos(angle) * dist + 'px');
      el.style.setProperty('--sy', Math.sin(angle) * dist + 'px');
      containerEl.appendChild(el);
      (function(node){
        setTimeout(function(){ if (node.parentNode) node.parentNode.removeChild(node); }, 600);
      })(el);
    }
  }

  function onInteractiveStarTap(el){
    if (el.classList.contains('pop')) return;
    el.classList.add('pop');
    spawnSparkles(el, bgStars);
    playSparkle();
    setTimeout(function(){ el.classList.remove('pop'); }, 650);
  }

  function scatterStars(){
    if (!bgStars) return;
    bgStars.innerHTML = '';
    var bookRect = book.getBoundingClientRect();
    var pad = 22;
    var vw = window.innerWidth, vh = window.innerHeight;
    var count = 16 + Math.floor(Math.random() * 5);
    var placed = 0, attempts = 0;
    var placedEls = [];

    while (placed < count && attempts < count * 10) {
      attempts++;
      var x = Math.random() * vw;
      var y = Math.random() * vh;
      if (x > bookRect.left - pad && x < bookRect.right + pad &&
          y > bookRect.top - pad && y < bookRect.bottom + pad) continue;

      var el = document.createElement('span');
      el.className = 'bg-star';
      var size = 7 + Math.random() * 10;
      var op = 0.3 + Math.random() * 0.4;
      var rot = Math.random() * 50 - 25;
      el.textContent = starChars[Math.floor(Math.random() * starChars.length)];
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.fontSize = size + 'px';
      el.style.color = starColors[Math.floor(Math.random() * starColors.length)];
      el.style.setProperty('--rot', rot + 'deg');

      if (Math.random() < 0.3) {
        el.classList.add('twinkle');
        el.style.setProperty('--base-op', op.toFixed(2));
        el.style.animationDelay = (Math.random() * 6) + 's';
      } else {
        el.style.opacity = op.toFixed(2);
        el.style.transform = 'rotate(' + rot + 'deg)';
      }

      bgStars.appendChild(el);
      placedEls.push(el);
      placed++;
    }

    // a small, undiscoverable handful of these stars are secretly interactive
    var interactiveCount = Math.min(placedEls.length, 4 + Math.floor(Math.random() * 2));
    var pool = placedEls.slice();
    for (var k = 0; k < interactiveCount && pool.length; k++) {
      var idx = Math.floor(Math.random() * pool.length);
      var star = pool.splice(idx, 1)[0];
      star.classList.add('interactive');
      star.addEventListener('click', function(){ onInteractiveStarTap(this); });
    }
  }

  scatterStars();
  var starResizeTimer = null;
  window.addEventListener('resize', function(){
    if (starResizeTimer) clearTimeout(starResizeTimer);
    starResizeTimer = setTimeout(scatterStars, 300);
  });

})();
</script>
</body>
</html>
